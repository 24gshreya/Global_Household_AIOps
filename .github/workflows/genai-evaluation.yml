name: GenAI Evaluation

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/genai/**"
      - "src/rag/**"
      - "src/evaluation/**"
      - "prompts/**"
      - "knowledge/**"
      - "evaluation/datasets/**"
      - "tests/genai/**"
      - ".github/workflows/genai-evaluation.yml"
      - "requirements.txt"

  pull_request:
    branches:
      - main
    paths:
      - "src/genai/**"
      - "src/rag/**"
      - "src/evaluation/**"
      - "prompts/**"
      - "knowledge/**"
      - "evaluation/datasets/**"
      - "tests/genai/**"
      - "requirements.txt"

jobs:
  evaluate-genai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run routing tests
        run: pytest tests/genai/test_routing.py -v

      - name: Run RAG tests
        run: pytest tests/unit/test_rag.py -v

      - name: Run safety tests
        run: pytest tests/genai/test_safety.py -v

      - name: Run regression tests
        run: pytest tests/genai/test_regression.py -v

      - name: Run quality gate tests
        run: pytest tests/genai/test_quality.py -v